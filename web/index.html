<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B1F3B" />
    <meta name="referrer" content="no-referrer" />
    <title>Messenger Web</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- use-credentials: a proxy password in front of the app (HTTP basic auth) is sent along; without it the
         manifest is fetched without and the app can't be installed -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <script src="/theme.js"></script>
    <!--CSS-->
  </head>
  <body>
    <div id="root"></div>
    <!--JS-->
  </body>
</html>
